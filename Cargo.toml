[workspace]
resolver = "2"
members = ["crates/canopy-core", "crates/canopy-lesson", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "1.1.1"

[workspace.dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
