id: "7.14"
section: 7
title: Manage remotes
kind: practice
teaches: [remote-manage]
requires: [remote-inspect, fetch]
flags: []
repo: work
start: work
repos:
  - { path: work, label: Your clone }
  - { path: origin.git, label: origin (your fork) }
  - { path: upstream.git, label: upstream (the club's repo) }
hints:
  - "`git remote add upstream ../upstream.git`, then `git fetch upstream`. The new commits appear as `upstream/main`."
  - "`git remote remove backup` drops the dead remote. `git remote rename origin fork` renames the other one."
  - "Count the extra commits with `git log --oneline origin/main..upstream/main`."
