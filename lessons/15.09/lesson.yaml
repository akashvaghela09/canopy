hints:
  - "`git bundle create ../full.bundle --all` packs every branch and tag into one file. `git bundle verify` and `list-heads` read it."
  - "A bundle file works wherever a URL works: clone it into `../offline` the usual way."
  - "After a new commit: `git bundle create ../update.bundle v1.0..main`, then in offline fetch or pull `main` from `../update.bundle`."
