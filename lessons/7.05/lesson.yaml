id: "7.05"
section: 7
title: Bring fetched work into your branch
kind: practice
teaches: [integrate-fetched]
requires: [fetch, merge-ff, merge-three-way]
flags: []
repo: work
start: work
repos:
  - { path: work, label: Your clone }
  - { path: origin.git, label: origin }
  - { path: teammate, label: Teammate (Sam) }
actions:
  - { id: teammate-push, label: "Teammate pushes a fix", script: actions/teammate-push.sh }
hints:
  - "Fetch first, then merge `origin/main` into `main` exactly as you would merge any other branch."
  - "The first merge fast-forwards because you have no commits of your own. After you commit and Sam pushes, the second `git merge origin/main` makes a merge commit."
