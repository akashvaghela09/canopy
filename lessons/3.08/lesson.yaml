hints:
  - "Open each expression with the command that shows a single commit, and read the id on its first line."
  - "`HEAD~3` is the merge commit. `^2` after it picks the merge's second parent, the branch that was merged in."
  - "`git show --stat HEAD~2` and `git show --stat HEAD~3^2`."
