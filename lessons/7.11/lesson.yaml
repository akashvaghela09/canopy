id: "7.11"
section: 7
title: Get a teammate's branch
kind: practice
teaches: [switch-remote-branch]
requires: [upstream, switch-create]
flags: []
minGit: "2.23"
repo: work
start: work
repos:
  - { path: work, label: Your clone }
  - { path: origin.git, label: origin }
  - { path: teammate, label: Teammate (Priya) }
hints:
  - "Your clone has not heard of `signage` yet. Fetch first, then `git switch signage`."
  - "After the switch, `git branch -vv` shows `signage` tracking `origin/signage`. Add your name to `trails/signage.md` and commit."
