hints:
  - "Start an interactive rebase over the last five commits. Each `squash` or `fixup` line melts into the pick line above it."
  - "Mark \"fix typo\" and \"wip\" as `squash` (or `fixup`), and \"oops forgot file\" as `fixup`. With `squash`, the editor opens for the combined message: leave only `Add login form`."
