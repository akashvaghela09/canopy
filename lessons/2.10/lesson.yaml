id: "2.10"
section: 2
title: Tell git what to ignore
kind: practice
teaches: [gitignore]
requires: [status, add-patterns, term-files, commit]
flags: []
repo: project
start: project
hints:
  - "`.gitignore` needs three lines: `build/`, `*.log` and `!audit.log`. The editor in the files panel is the simplest way to write them."
  - "In the terminal, `echo 'build/' > .gitignore` writes the first line and `echo '*.log' >> .gitignore` appends another (two arrows add to the end). Use single quotes around the `!` line, or the shell will complain."
  - "When the status shows only .gitignore, audit.log and notes.txt, stage everything and commit."
panels: [files]
