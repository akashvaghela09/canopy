hints:
  - "Start with `git fsck --full --lost-found` and deal with each line it prints."
  - "A dangling tree is a snapshot that never got its commit. List it, then build the commit around it with commit-tree and point a branch at it."
  - "The branch file for release names a ref that no longer exists. Point release at the commit tagged v1.0."
