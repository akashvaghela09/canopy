hints:
  - "`git hash-object` takes file names. Give it two files at once and compare the two lines."
  - "Without `-w` nothing is stored. Run it again with `-w` and then look in `.git/objects`."
  - "The object lands in `.git/objects/<first two characters>/<remaining 38 characters>`."
