id: "9.25"
section: 9
title: Pull with rebase
kind: practice
teaches: [pull-rebase]
requires: [rebase, pull, push-rejected, rebase-conflict]
flags: []
repo: work
start: work
repos:
  - { path: work, label: "Your clone" }
  - { path: origin.git, label: "origin" }
  - { path: teammate, label: "Teammate (Sam)" }
hints:
  - "Try to push first and read the rejection: origin has a commit you do not have. Then pull so that your two commits are replayed on top of Sam's."
  - "`git pull --rebase`, then push again. To make rebase the default for this clone: `git config pull.rebase true`."
