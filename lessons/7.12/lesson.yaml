id: "7.12"
section: 7
title: Pull safely
kind: practice
teaches: [pull-ff-only]
requires: [pull, merge-ff-only]
flags: []
repo: work
start: work
repos:
  - { path: work, label: Your clone }
  - { path: origin.git, label: origin }
  - { path: teammate, label: Teammate (Sam) }
actions:
  - { id: teammate-push, label: "Teammate pushes a fix", script: actions/teammate-push.sh }
hints:
  - "`git pull --ff-only` succeeds the first time: you have no commits of your own."
  - "After your commit and Sam's push, `git pull --ff-only` refuses. Look at `main..origin/main`, then merge `origin/main` into main yourself."
