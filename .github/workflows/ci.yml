name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p dist
      - name: Rust tests
        run: cargo test --workspace
      - name: Validate lessons (prerequisite order, file shape)
        run: cargo run -q -p canopy-lesson -- validate
      - name: Test every lesson's solution against its goals
        run: cargo run -q -p canopy-lesson -- test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Frontend tests
        run: pnpm test
