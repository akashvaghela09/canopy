name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p dist
      - name: Rust tests
        run: cargo test --workspace
      - name: Validate lessons (prerequisite order, file shape)
        run: cargo run -q -p canopy-lesson -- validate
      - name: Test every lesson's solution against its goals
        run: cargo run -q -p canopy-lesson -- test
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Frontend tests
        run: pnpm test

  # The lessons run real bash and git: prove all of them on macOS (bash 3.2,
  # BSD tools) and Windows (Git for Windows' bash) too.
  lessons:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Some lesson *solutions* (test-only scripts, never run for learners) use
      # GNU sed programs as rebase editors.
      - name: GNU sed for lesson solutions (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gnu-sed
          echo "$(brew --prefix gnu-sed)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: git and bash versions
        shell: bash
        run: git --version && bash --version | head -1
      - name: Core tests
        run: cargo test -p canopy-core
      - name: Test every lesson's solution against its goals
        run: cargo run -q -p canopy-lesson -- test
      - name: Transcripts of a few failing lessons
        if: failure()
        shell: bash
        run: cargo run -q -p canopy-lesson -- test -v 7.12 12.10 3.01 9.15 || true
