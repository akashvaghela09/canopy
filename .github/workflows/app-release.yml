name: Release app

# Builds Linux, macOS and Windows installers and publishes them as a GitHub release when a
# version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the version in src-tauri/tauri.conf.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg,app
          - os: windows-latest
            args: --bundles nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.rs stamps the lesson content version from git history
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME does not match app version $have"; exit 1; }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Canopy ${{ github.ref_name }}"
          releaseBody: |
            Learn git by using it.

            - **Linux:** `.deb` (Debian/Ubuntu/Mint), `.rpm` (Fedora/openSUSE) or `.AppImage` (any distro).
            - **macOS:** `.dmg` (Apple silicon and Intel). Not notarized yet: the first time, right-click Canopy in Applications and choose Open.
            - **Windows:** `.exe` installer or `.msi`. Needs Git for Windows. Not signed yet: on the SmartScreen prompt choose More info → Run anyway.

            Requires git 2.32 or newer. Lessons can be updated later from Settings → Check for updates.
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: ${{ matrix.args }}
