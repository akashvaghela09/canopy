name: Release app

# Builds Linux installers and publishes them as a GitHub release when a
# version tag is pushed, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the version in src-tauri/tauri.conf.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.rs stamps the lesson content version from git history
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME does not match app version $have"; exit 1; }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Canopy ${{ github.ref_name }}"
          releaseBody: |
            Learn git by running real git.

            Linux installers: `.deb` (Debian/Ubuntu/Mint), `.rpm` (Fedora/openSUSE) and `.AppImage` (any distro).
            Requires git 2.32 or newer. Lessons can be updated later from Settings → Check for updates.
          releaseDraft: false
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          args: --bundles deb,rpm,appimage
