<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f9a63"/>
      <stop offset="1" stop-color="#14583b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fdcab"/>
      <stop offset="1" stop-color="#5cc387"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- canopy: three overlapping crowns -->
  <g fill="url(#leaf)" opacity="0.35">
    <circle cx="352" cy="420" r="168"/>
    <circle cx="672" cy="420" r="168"/>
    <circle cx="512" cy="312" r="184"/>
  </g>
  <!-- the git graph that forms the tree -->
  <g fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 820 V330"/>
    <path d="M512 640 C512 540 352 560 352 440"/>
    <path d="M512 600 C512 510 672 530 672 440"/>
  </g>
  <g fill="#ffffff">
    <circle cx="512" cy="820" r="58"/>
    <circle cx="352" cy="430" r="58"/>
    <circle cx="672" cy="430" r="58"/>
  </g>
  <!-- HEAD: the ringed newest commit at the top -->
  <circle cx="512" cy="300" r="58" fill="#ffffff"/>
  <circle cx="512" cy="300" r="96" fill="none" stroke="#ffffff" stroke-width="20"/>
</svg>
